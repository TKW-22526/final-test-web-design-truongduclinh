<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>

    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="site-brand">
                <div class="logo"><img src="../assets/images/logo-duc-linh.svg" alt="Shop Thể Thao logo"></div>
                <div>
                    <h2 style="margin:0; font-size:18px">Chi tiết sản phẩm</h2>
                </div>
            </div>

            <nav>
                <ul class="menu">
                    <li><a href="../index.html">Trang chủ</a></li>
                    <li><a href="san-pham.html">Sản phẩm</a></li>
                    <li><a href="gioi-thieu.html">Giới thiệu</a></li>
                    <li><a href="lien-he.html">Liên hệ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container py-4">
    <div id="detail"></div>
</div>

<script>
    const products = [
        {id:"01", name:"Bóng đá loại A", price:290, image:"../assets/images/bongloaia.JPG", description:"Bóng đá loại A chất liệu cao cấp, độ nảy tốt, phù hợp tập luyện và thi đấu.", productLink:"chi-tiet.html"},
        {id:"02", name:"Bóng đá loại B", price:350, image:"../assets/images/bongloaib.JPG", description:"Bóng đá loại B thiết kế bền đẹp, kiểm soát tốt và phù hợp cho mọi cấp độ.", productLink:"chi-tiet.html"},
        {id:"03", name:"Bóng chuyền loại A", price:320, image:"../assets/images/bongchuyena.JPG", description:"Bóng chuyền loại A êm tay, độ bền cao, dành cho tập luyện và thi đấu.", productLink:"chi-tiet.html"},
        {id:"04", name:"Bóng chuyền loại B", price:380, image:"../assets/images/bongchuyenb.JPG", description:"Bóng chuyền loại B chống mài mòn tốt, thiết kế đẹp mắt và bám tay tốt.", productLink:"chi-tiet.html"},
        {id:"05", name:"Giày Bóng Đá", price:650, image:"../assets/images/GiayBongDa.jpg", description:"Giày bóng đá chuyên nghiệp, đinh thấp, ôm chân tốt, phù hợp sân cỏ nhân tạo và sân cỏ tự nhiên.", productLink:"chi-tiet.html"},
        {id:"06", name:"Giày Bóng Chuyền", price:590, image:"../assets/images/GiayBongChuyen.jpg", description:"Giày bóng chuyền nhẹ, chống trượt tốt và hỗ trợ cổ chân, phù hợp cho tập luyện và thi đấu indoor.", productLink:"chi-tiet.html"}
    ];

    let id = new URLSearchParams(window.location.search).get("id");

    let product = products.find(function(p){
        return p.id == id;
    });

    if(product){
        document.getElementById("detail").innerHTML =
            '<div class="detail-card card p-3 shadow">' +
                '<div class="detail-image-wrapper">' +
                    '<img src="' + product.image + '" class="detail-image img-fluid" alt="' + product.name + '">' +
                '</div>' +
                '<div class="detail-info">' +
                    '<h2>' + product.name + '</h2>' +
                    '<h4 class="text-danger">' + product.price + 'k</h4>' +
                    '<p class="detail-description">' + product.description + '</p>' +
                    '<div class="detail-actions">' +
                        '<button onclick="buy()" class="btn btn-primary">Mua ngay</button>' +
                        '<a href="san-pham.html" class="btn btn-secondary">Quay lại</a>' +
                    '</div>' +
                '</div>' +
            '</div>';
    }
    else{
        document.getElementById("detail").innerHTML =
            '<div class="alert alert-warning">' +
                'Không tìm thấy sản phẩm' +
            '</div>';
    }

    function buy(){
        alert("Đã mua: " + product.name);
    }
</script>
